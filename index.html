
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>Feelings Adventure</title>

<style>
:root {
    --purple: #7357d5;
    --pink: #f078a4;
    --mint: #30b894;
    --ink: #303454;
    --pale: #f4f0ff;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 12px;
    font-family: Arial, Helvetica, sans-serif;
    text-align: center;
    color: var(--ink);
    background: linear-gradient(135deg, #dcf7ff, #f7e6ff, #fff2d4);
    min-height: 100vh;
}

h1 {
    font-size: clamp(28px, 6vw, 42px);
    color: var(--purple);
    margin: 12px 0 4px;
}

.teacher {
    color: #d84f8b;
    font-weight: bold;
    margin-bottom: 14px;
}

.panel {
    max-width: 780px;
    margin: 14px auto;
    background: white;
    padding: clamp(14px, 4vw, 26px);
    border-radius: 25px;
    box-shadow: 0 10px 28px #4433661c;
}

.hidden { display: none !important; }

button, input { font: inherit; }

button {
    border: 0;
    border-radius: 14px;
    padding: 12px 18px;
    margin: 5px;
    color: white;
    background: var(--purple);
    font-weight: bold;
    cursor: pointer;
    transition: transform .12s;
}

button:active { transform: scale(.98); }
button:disabled { opacity: .55; cursor: not-allowed; }

input {
    width: min(100%, 340px);
    padding: 13px;
    border: 2px solid #cfc2ff;
    border-radius: 13px;
    font-size: 18px;
    text-align: center;
    direction: ltr;
}

.stats {
    display: flex;
    justify-content: space-around;
    gap: 8px;
    flex-wrap: wrap;
    font-weight: bold;
}

.progress {
    height: 10px;
    background: #eee;
    border-radius: 20px;
    margin: 15px 0;
    overflow: hidden;
}

#bar {
    height: 100%;
    width: 0;
    background: var(--mint);
    transition: width .2s;
}

#picture {
    width: min(100%, 360px);
    height: 250px;
    margin: 12px auto;
    background: var(--pale);
    border-radius: 20px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
}

#picture img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
}

#word {
    font-size: clamp(28px, 6vw, 36px);
    font-weight: bold;
    color: var(--purple);
    background: white;
    border: 2px solid #e6ddff;
    border-radius: 15px;
    padding: 12px;
    margin: 12px auto;
    overflow-wrap: anywhere;
}

.pink { background: var(--pink); }
.green { background: var(--mint); }

#choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
}

.choice {
    background: #f6f2ff;
    color: var(--ink);
    border: 3px solid #e6ddff;
    padding: 8px;
    box-shadow: none;
    min-width: 0;
    margin: 0;
}

.choice img {
    width: 100%;
    height: 150px;
    object-fit: contain;
    border-radius: 10px;
    display: block;
    background: #f4f0ff;
}

.choice span {
    display: block;
    padding: 8px 2px 3px;
    font-size: 17px;
    font-weight: bold;
    overflow-wrap: anywhere;
}

.correct {
    border-color: #20b98a !important;
    background: #e0fff3 !important;
}

.wrong {
    border-color: #f07891 !important;
    background: #fff0f2 !important;
}

#feedback {
    min-height: 30px;
    margin: 12px;
    font-weight: bold;
}

#spellArea p { margin-bottom: 12px; }

.small {
    font-size: 13px;
    color: #777;
}

.badge {
    display: inline-block;
    background: #fff1c9;
    color: #735000;
    border-radius: 99px;
    padding: 6px 12px;
    font-size: 13px;
    font-weight: bold;
}

@media (max-width: 430px) {
    body { padding: 6px; }
    .panel { padding: 13px; }
    #picture { height: 220px; }
    .choice img { height: 115px; }
    .choice span { font-size: 15px; }
}
</style>
</head>

<body>

<header>
    <h1>Feelings Adventure</h1>
    <div class="teacher">Teacher: Ms.Ramezanzadeh</div>
</header>

<main class="panel">

<section id="start">
    <span class="badge">LISTEN • LOOK • SPELL</span>
    <h2>Ready to Play?</h2>
    <p>Enter your name to start your adventure!</p>

    <form id="startForm">
        <input id="player" maxlength="24"
               placeholder="Your name"
               aria-label="Your name"
               required autocomplete="given-name">
        <br>
        <button type="submit">Let's Play!</button>
    </form>

    <p class="small">Three fun stages. Eight feelings. Let's learn!</p>
</section>

<section id="game" class="hidden">

    <h2 id="welcome"></h2>

    <div class="stats">
        <span>Score: <b id="score">0</b></span>
        <span>Lives: <b id="lives">♥ ♥ ♥ ♥ ♥</b></span>
        <span>Question: <b id="number">1</b>/24</span>
    </div>

    <div class="progress">
        <div id="bar"></div>
    </div>

    <h3 id="stage"></h3>

    <div id="picture"></div>
    <div id="word"></div>

    <button id="listen" class="pink" type="button">Listen</button>

    <div id="choices"></div>

    <div id="spellArea" class="hidden">
        <p>Listen carefully. Type the correct word!</p>
        <input id="spellInput"
               placeholder="Type the word"
               autocomplete="off"
               autocapitalize="none"
               spellcheck="false">
        <br>
        <button id="checkSpell" type="button">Check Answer</button>
    </div>

    <div id="feedback" aria-live="polite"></div>
</section>

<section id="end" class="hidden">
    <h2 id="endTitle">Amazing Job!</h2>
    <p id="endMessage"></p>
    <h2>Score: <span id="finalScore">0</span>/240</h2>
    <p id="stars"></p>
    <button id="replay" type="button">Play Again</button>
</section>

</main>

<script>
'use strict';

const feelings = [
    { word: 'Thirsty', image: 'images/thirsty.jpg', emoji: '🥤', sentence: 'I am thirsty.' },
    { word: 'Hungry', image: 'images/hungry.jpg', emoji: '🍎', sentence: 'I am hungry.' },
    { word: 'Sad', image: 'images/sad.jpg', emoji: '😢', sentence: 'I am sad.' },
    { word: 'Shy', image: 'images/shy.jpg', emoji: '😊', sentence: 'I am shy.' },
    { word: 'Happy', image: 'images/happy.jpg', emoji: '😄', sentence: 'I am happy.' },
    { word: 'Scared', image: 'images/scared.jpg', emoji: '😨', sentence: 'I am scared.' },
    { word: 'Sleepy', image: 'images/sleepy.jpg', emoji: '😴', sentence: 'I am sleepy.' },
    { word: 'Tired', image: 'images/tired.jpg', emoji: '🥱', sentence: 'I am tired.' }
];

const $ = id => document.getElementById(id);

let playerName = '';
let score = 0;
let lives = 5;
let index = 0;
let questions = [];
let current = null;
let locked = false;
let advanceTimer = null;

// Remember the previous order during this page session.
let previousOrder = '';

const encouragement = [
    'Great job!',
    'Well done!',
    'Fantastic!',
    'You did it!',
    'Brilliant!',
    'Super work!',
    'Wonderful!',
    'That is correct!',
    'Excellent work!',
    'Amazing!',
    'Keep shining!',
    'Perfect!'
];

const tryAgainPhrases = [
    'Try again!',
    'Have another go!',
    'You can do it!',
    'Almost! Try once more!',
    'Keep trying!',
    'Give it another try!',
    'You are doing great!',
    'Think carefully!'
];

function randomPhrase(list) {
    return list[Math.floor(Math.random() * list.length)];
}

function shuffle(items) {
    const a = [...items];

    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }

    return a;
}

function speak(text) {
    if (!('speechSynthesis' in window)) return;

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-GB';
    utterance.rate = 0.85;

    window.speechSynthesis.speak(utterance);
}

function stopSpeech() {
    if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
    }
}

function makeImage(feeling) {
    const img = document.createElement('img');

    img.src = feeling.image;
    img.alt = feeling.word;
    img.loading = 'eager';

    img.onerror = function () {
        const fallback = document.createElement('div');

        fallback.setAttribute('role', 'img');
        fallback.setAttribute('aria-label', feeling.word);

        fallback.style.cssText = `
            width:100%;
            height:100%;
            min-height:100px;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:8px;
            background:linear-gradient(135deg,#f4f0ff,#ffeaf3);
            color:#7357d5;
            border-radius:12px;
        `;

        const emoji = document.createElement('span');
        emoji.textContent = feeling.emoji;
        emoji.style.fontSize = 'clamp(54px,12vw,86px)';

        const label = document.createElement('span');
        label.textContent = feeling.word;
        label.style.cssText = 'font-size:18px;font-weight:bold;';

        fallback.append(emoji, label);
        img.replaceWith(fallback);
    };

    return img;
}

function updateStats() {
    $('score').textContent = score;
    $('lives').textContent =
        '♥ '.repeat(lives) + '♡ '.repeat(5 - lives);

    $('number').textContent = Math.min(index + 1, 24);
    $('bar').style.width = (index / 24 * 100) + '%';
}

function buildQuestions() {
    // Keep the three stages in order, but shuffle the words
    // separately inside each stage.
    let result;
    let signature;
    let attempts = 0;

    do {
        result = [
            ...shuffle(feelings).map(f => ({ type: 'listen', f })),
            ...shuffle(feelings).map(f => ({ type: 'picture', f })),
            ...shuffle(feelings).map(f => ({ type: 'spell', f }))
        ];

        signature = result
            .map(q => q.type + ':' + q.f.word)
            .join('|');

        attempts++;
    } while (
        signature === previousOrder &&
        attempts < 50
    );

    previousOrder = signature;
    return result;
}

function startGame() {
    stopSpeech();

    if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
    }

    score = 0;
    lives = 5;
    index = 0;
    current = null;
    locked = false;

    questions = buildQuestions();

    $('start').classList.add('hidden');
    $('end').classList.add('hidden');
    $('game').classList.remove('hidden');

    $('welcome').textContent = 'Good luck, ' + playerName + '!';

    showQuestion();
}

$('startForm').addEventListener('submit', event => {
    event.preventDefault();

    playerName = $('player').value.trim();
    if (!playerName) return;

    startGame();
});

function showQuestion() {
    stopSpeech();

    if (lives <= 0 || index >= questions.length) {
        endGame();
        return;
    }

    current = questions[index];
    locked = false;

    $('choices').replaceChildren();
    $('feedback').textContent = '';
    $('feedback').style.color = '';

    $('spellArea').classList.add('hidden');

    $('spellInput').value = '';
    $('spellInput').disabled = false;
    $('checkSpell').disabled = false;
    $('listen').disabled = false;

    $('picture').replaceChildren();
    $('word').textContent = '';

    $('listen').classList.remove('hidden');
    $('listen').textContent = 'Listen';

    const f = current.f;

    if (current.type === 'listen') {
        $('stage').textContent = 'Stage 1: Listen and Choose';

        $('word').textContent = f.word;

        const options = shuffle([
            f,
            ...shuffle(feelings.filter(x => x.word !== f.word)).slice(0, 3)
        ]);

        options.forEach(option => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'choice';

            b.appendChild(makeImage(option));

            const label = document.createElement('span');
            label.textContent = option.word;

            b.appendChild(label);
            b.addEventListener('click', () => choose(option, b));

            $('choices').appendChild(b);
        });

        // Speak the word immediately.
        speak(f.word);
    }

    if (current.type === 'picture') {
        $('stage').textContent =
            'Stage 2: Listen and Find the Picture';

        // Do not show the target picture or target word above.
        // The learner must listen and find the correct image.
        $('picture').replaceChildren();
        $('word').textContent = 'Listen and choose the picture!';

        const options = shuffle([
            f,
            ...shuffle(feelings.filter(x => x.word !== f.word)).slice(0, 3)
        ]);

        options.forEach(option => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'choice';

            b.appendChild(makeImage(option));

            const label = document.createElement('span');
            label.textContent = option.word;

            b.appendChild(label);
            b.addEventListener('click', () => choose(option, b));

            $('choices').appendChild(b);
        });

        $('listen').textContent = 'Listen Again';

        // Automatically say the target word when the question appears.
        speak(f.word);
    }

    if (current.type === 'spell') {
        $('stage').textContent = 'Stage 3: Spelling Challenge';

        $('picture').appendChild(makeImage(f));
        $('word').textContent = 'Spell the word!';
        $('spellArea').classList.remove('hidden');
        $('listen').textContent = 'Listen Again';

        speak(f.word);
    }

    updateStats();
}

$('listen').addEventListener('click', () => {
    if (!current || locked) return;

    // Always repeat the target word.
    speak(current.f.word);
});

function choose(option, button) {
    if (locked) return;

    if (option.word === current.f.word) {
        locked = true;
        score += 10;

        button.classList.add('correct');

        const praise = randomPhrase(encouragement);

        $('feedback').textContent = praise;
        $('feedback').style.color = '#15976f';

        speak(praise + ' ' + current.f.word);
        finishQuestion();

    } else {
        button.classList.add('wrong');
        button.disabled = true;

        lives--;
        updateStats();

        if (lives <= 0) {
            locked = true;

            $('feedback').textContent =
                'Game Over! Good try, ' + playerName + '!';

            speak('Game over! Good try, ' + playerName + '!');

            if (advanceTimer) clearTimeout(advanceTimer);

            advanceTimer = setTimeout(endGame, 1200);

        } else {
            $('feedback').textContent = randomPhrase(tryAgainPhrases);
            $('feedback').style.color = '#db578e';

            speak($('feedback').textContent);
        }
    }
}

$('checkSpell').addEventListener('click', checkSpelling);

$('spellInput').addEventListener('keydown', event => {
    if (event.key === 'Enter') {
        event.preventDefault();
        checkSpelling();
    }
});

function checkSpelling() {
    if (locked || !current || current.type !== 'spell') return;

    const answer = $('spellInput').value.trim().toLowerCase();
    const correct = current.f.word.toLowerCase();

    if (answer === correct) {
        locked = true;
        score += 10;

        const praise = randomPhrase(encouragement);

        $('feedback').textContent = praise;
        $('feedback').style.color = '#15976f';

        speak(praise + ' ' + current.f.word);
        finishQuestion();

    } else {
        // Spelling mistakes do not reduce lives.
        $('feedback').textContent = randomPhrase(tryAgainPhrases);
        $('feedback').style.color = '#db578e';

        $('spellInput').select();
        speak($('feedback').textContent);
    }
}

function finishQuestion() {
    $('choices').querySelectorAll('button').forEach(b => {
        b.disabled = true;
    });

    $('spellInput').disabled = true;
    $('checkSpell').disabled = true;
    $('listen').disabled = true;

    updateStats();

    if (advanceTimer) clearTimeout(advanceTimer);

    advanceTimer = setTimeout(() => {
        advanceTimer = null;
        index++;

        if (lives <= 0 || index >= questions.length) {
            endGame();
        } else {
            showQuestion();
        }
    }, 1400);
}

function endGame() {
    if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
    }

    stopSpeech();

    $('game').classList.add('hidden');
    $('end').classList.remove('hidden');

    $('bar').style.width =
        (Math.min(index, 24) / 24 * 100) + '%';

    $('finalScore').textContent = score;

    if (lives <= 0) {
        $('endTitle').textContent = 'Game Over, ' + playerName + '!';
        $('endMessage').textContent =
            'Good effort! Keep practicing and try again!';

        $('stars').textContent = 'Every try helps you learn!';

        speak(
            'Game over, ' + playerName +
            '. Good effort! Keep practicing!'
        );

    } else {
        $('endTitle').textContent = randomPhrase([
            'Amazing job, ' + playerName + '!',
            'Fantastic work, ' + playerName + '!',
            'You did it, ' + playerName + '!',
            'Brilliant effort, ' + playerName + '!'
        ]);

        $('endMessage').textContent =
            'You completed the Feelings Adventure!';

        $('stars').textContent = score >= 200
            ? 'Outstanding! You are a feelings superstar!'
            : score >= 150
                ? 'Wonderful work! Keep shining!'
                : 'Great effort! You are learning more every day!';

        speak($('endTitle').textContent + ' ' + $('stars').textContent);
    }
}

$('replay').addEventListener('click', () => {
    stopSpeech();

    if (advanceTimer) {
        clearTimeout(advanceTimer);
        advanceTimer = null;
    }

    score = 0;
    lives = 5;
    index = 0;
    current = null;
    locked = false;

    $('end').classList.add('hidden');
    $('start').classList.remove('hidden');

    $('player').value = '';
    $('player').focus();
});
</script>

</body>
</html>
